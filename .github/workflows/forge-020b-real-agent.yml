name: FORGE-020B real Tool-Using Local Agent

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020b-real-agent.yml

permissions:
  contents: read

jobs:
  real-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      FORGE_LOCAL_BASE_URL: http://127.0.0.1:11434/v1
      FORGE_LOCAL_MODEL: qwen2.5:7b-instruct
      FORGE_LOCAL_TIMEOUT_SECONDS: '300'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '10m'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Forge backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Install Ollama on ephemeral runner
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start real Ollama runtime
        shell: bash
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          echo $! >/tmp/ollama.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo 'Ollama runtime reachable'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull selected real open-weight model
        shell: bash
        run: |
          ollama pull qwen2.5:7b-instruct
          ollama list
          curl -sf http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json

      - name: Focused FORGE-020B regression tests
        working-directory: backend
        run: python -m pytest -q tests/test_forge_020b_local_agent_production.py

      - name: Run genuine qwen2.5 7B Tool-Using Agent through production HTTP path
        id: agent
        shell: bash
        run: |
          set +e
          python scripts/verify_local_agent_020b.py 2>&1 | tee /tmp/forge-020b-agent.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > /tmp/forge-020b-agent-exit-code.txt
          exit 0

      - name: Show durable agent evidence
        if: always()
        shell: bash
        run: |
          echo '--- verifier output ---'
          cat /tmp/forge-020b-agent.log || true
          echo '--- evidence files ---'
          find docs/evidence/agent020b -maxdepth 1 -type f -name '*.json' -print 2>/dev/null || true
          for f in docs/evidence/agent020b/*.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-020b-real-local-agent-evidence
          if-no-files-found: warn
          path: |
            docs/evidence/agent020b/*.json
            /tmp/forge-020b-agent.log
            /tmp/forge-020b-agent-exit-code.txt
            /tmp/ollama-tags.json
            /tmp/ollama.log

      - name: Enforce real-agent verifier result
        if: always()
        shell: bash
        run: |
          code='${{ steps.agent.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'FORGE-020B verifier did not produce an exit code.'
            exit 1
          fi
          if [ "$code" != '0' ]; then
            echo "FORGE-020B real Tool-Using Agent failed with exit code $code."
            exit "$code"
          fi
          echo 'FORGE-020B real Tool-Using Local Agent verifier returned success.'

      - name: Stop Ollama
        if: always()
        shell: bash
        run: kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true
