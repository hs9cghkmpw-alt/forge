name: FORGE simulation loop vertical slice migration

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_simulation_patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded simulation-loop patch
        run: python scripts/forge_add_simulation_loop.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q "case 'simulation_loop'" frontend/lib/json_ui/schema/forge_document.dart
          grep -q "WIDGET_TYPES_V1_13_ADDITIONS" backend/app/ai/validators/schema_validator.py
          grep -q "registerV1_13Widgets" frontend/lib/json_ui/widget_registry/widget_registry.dart
      - name: Remove one-shot migration machinery
        run: rm scripts/forge_add_simulation_loop.py .github/workflows/forge_simulation_patch.yml
      - name: Commit vertical slice
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "forge-golden: wire simulation loop through runtime and validator"
          git push origin HEAD:claude/forge-master-handoff-k46jns
