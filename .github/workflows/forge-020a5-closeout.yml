name: FORGE-020A5 closeout docs and cleanup

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a5-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - name: Record changelog and technical-debt closure
        env:
          CHANGELOG_SECTION_B64: 
          TECH_DEBT_SECTION_B64: 
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          updates = [
              ('CHANGELOG.md', '## 2026-08-29 — FORGE-020A5: Genuine Real Local Level 0 PASS', 'CHANGELOG_SECTION_B64'),
              ('TECH_DEBT.md', '# TD020A5 — Real Local Level 0 execution gate', 'TECH_DEBT_SECTION_B64'),
          ]
          for path, marker, env_name in updates:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  section = base64.b64decode(os.environ[env_name]).decode('utf-8')
                  p.write_text(section + text, encoding='utf-8')
          PY

      - name: Verify durable closeout files exist
        shell: bash
        run: |
          test -f docs/evidence/level0/level0-20260828-230922.json
          test -f docs/reports/FORGE-020A5-REAL-LOCAL-LEVEL0-CLOSEOUT-report.md
          grep -q 'Real Local Model runs: \*\*1\*\*' docs/HANDOFF.md
          grep -q 'Level 0 = \*\*PASS\*\*' CHANGELOG.md
          grep -q 'Resolved in FORGE-020A5' TECH_DEBT.md
          git diff --check

      - name: Remove one-off workflows
        shell: bash
        run: |
          git rm -f .github/workflows/forge-020a-real-level0.yml
          git rm -f .github/workflows/forge-020a5-closeout.yml

      - name: Commit and push final 020A closeout
        shell: bash
        run: |
          git config user.name 'forge-020a5-closeout-bot'
          git config user.email 'forge-020a5-closeout-bot@users.noreply.github.com'
          git add CHANGELOG.md TECH_DEBT.md
          git add -u .github/workflows
          git status --short
          git diff --cached --check
          git commit -m 'docs: finalize FORGE-020A real Local Level0 closeout'
          git push origin HEAD:claude/forge-master-handoff-k46jns
