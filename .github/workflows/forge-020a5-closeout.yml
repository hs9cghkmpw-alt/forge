name: FORGE-020A5 closeout docs and cleanup

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a5-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - name: Record changelog and technical-debt closure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text(encoding='utf-8')
          marker = '## 2026-08-29 — FORGE-020A5: Genuine Real Local Level 0 PASS'
          section = '''## 2026-08-29 — FORGE-020A5: Genuine Real Local Level 0 PASS

- Prompt / provider JSON schema / strict Entity evidence now derive structural limits from the canonical `forge_ai/core/semantics/entity_contract.py` contract.
- Canonical model contract: identifier `^[a-z][a-z0-9_]*$`, fields 1–6, choices 2–6.
- The first real qwen run was correctly rejected because Forge had to apply `identifier_normalized`; repaired output did not become positive model evidence.
- Product fix commit: `9e515c03f56cd49eb4b0a6d0440a53e15501adc5`.
- Real rerun: GitHub Actions `33219195627`, Ollama `0.33.2`, `qwen2.5:7b-instruct` Q4_K_M, digest `845dbda0ea48ed749caafd9e6037047aa19acfcfd82e7047ca97d631a0b697e`.
- Production evidence proved `generation_source=local_ai`, `structure_source=ai_entity_synthesis`, `structure_provider=local`, `structure_task=entity_synthesis`, accepted schema mode, raw strict-contract PASS, no Entity repairs, Validator PASS, production Evidence UID and REAL verification.
- Level 0 = **PASS**; Real Local Model runs **0 → 1**; baseline-ready runs **1**.
- Passing evidence committed at `docs/evidence/level0/level0-20260828-230922.json`.
- Normal CI run `33219195713` on the real-run trigger commit was **SUCCESS** with all four jobs green.
- Generated App Quality Golden Gate remains **FAIL**; this Level 0 milestone does not override visual/product-quality evidence.
- Next architecture stage: **FORGE-020B Tool-Using Local Agent production wiring**.

'''
          if marker not in ch:
              changelog.write_text(section + ch, encoding='utf-8')

          debt = Path('TECH_DEBT.md')
          td = debt.read_text(encoding='utf-8')
          td_marker = '# TD020A5 — Real Local Level 0 execution gate'
          td_section = '''# TD020A5 — Real Local Level 0 execution gate

**Resolved in FORGE-020A5.** A genuine `qwen2.5:7b-instruct` / Ollama production-path run now satisfies the fail-closed structure-integrity gate without Forge Entity repair. Evidence: `docs/evidence/level0/level0-20260828-230922.json`; workflow run `33219195627`; Real Local Model runs = 1. This closes only the Level 0 real-runtime gate. It does **not** close Generated App Quality, browser/Playwright visual verification, GPU performance baselines, Tool-Using Agent wiring, Generation Episodes, Dataset Builder, training/adapters or Self-Extension.

'''
          if td_marker not in td:
              debt.write_text(td_section + td, encoding='utf-8')
          PY

      - name: Verify durable closeout files exist
        shell: bash
        run: |
          test -f docs/evidence/level0/level0-20260828-230922.json
          test -f docs/reports/FORGE-020A5-REAL-LOCAL-LEVEL0-CLOSEOUT-report.md
          grep -q 'Real Local Model runs: \*\*1\*\*' docs/HANDOFF.md
          grep -q 'Level 0 = \*\*PASS\*\*' CHANGELOG.md
          grep -q 'Resolved in FORGE-020A5' TECH_DEBT.md
          git diff --check

      - name: Remove one-off real-run and closeout workflows
        shell: bash
        run: |
          git rm -f .github/workflows/forge-020a-real-level0.yml
          git rm -f .github/workflows/forge-020a5-closeout.yml

      - name: Commit and push final 020A closeout
        shell: bash
        run: |
          git config user.name 'forge-020a5-closeout-bot'
          git config user.email 'forge-020a5-closeout-bot@users.noreply.github.com'
          git add CHANGELOG.md TECH_DEBT.md docs/HANDOFF.md docs/reports/FORGE-020A5-REAL-LOCAL-LEVEL0-CLOSEOUT-report.md docs/evidence/level0/level0-20260828-230922.json
          git add -u .github/workflows
          git status --short
          git diff --cached --check
          git commit -m 'docs: finalize FORGE-020A real Local Level0 closeout'
          git push origin HEAD:claude/forge-master-handoff-k46jns
