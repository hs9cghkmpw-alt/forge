name: Fix map self-extension E2E

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - name: Patch map prerequisite and exhaustive contracts
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{path}: anchor not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Semantic prerequisite: a map needs coordinate DATA capabilities.
          # This does not perform or claim geocoding; it makes explicit numeric
          # coordinates part of the generated record model.
          replace_once(
              'forge_ai/core/semantics/capability_plan.py',
              '    field_tuple = tuple(fields)\n\n    # -- 構造（見せ方とは独立） -----------------------------------------\n',
              '''    # Geographic rendering requires explicit coordinate data.  This is a\n    # reusable capability prerequisite, not a fishing-specific template and not\n    # geocoding: free-form place text is never converted into coordinates here.\n    if "view.map" in directly_requested:\n        for value in ("latitude", "longitude"):\n            name, label, kind, capability_id = _FIELD_BLUEPRINT[value]\n            if all(field.name != name for field in fields):\n                requested.add(capability_id)\n                fields.append(PlannedField(\n                    name=name,\n                    label=label,\n                    kind=kind,\n                    capability=capability_id,\n                    origin_role=SemanticRole.RECORDED_DATA,\n                ))\n\n    field_tuple = tuple(fields)\n\n    # -- 構造（見せ方とは独立） -----------------------------------------\n''',
          )

          # 2) Sealed Flutter vocabulary must stay exhaustive.
          replace_once(
              'frontend/lib/json_ui/widget_registry/widget_registry_core.dart',
              "      ForgeSimulationLoopWidgetNode() => 'simulation_loop',\n      ForgeUnknownWidgetNode() => 'unknown',\n",
              "      ForgeSimulationLoopWidgetNode() => 'simulation_loop',\n      ForgeMapViewWidgetNode() => 'map_view',\n      ForgeUnknownWidgetNode() => 'unknown',\n",
          )

          # 3) Black-box renderer contract duplicates the sealed switch on purpose.
          replace_once(
              'frontend/test/features/app_generation/data/datasources/mock_generator_renderer_contract_test.dart',
              "  'metric_view',\n};\n",
              "  'metric_view',\n  'simulation_loop', 'audio_mixer', 'simulation_progress', 'map_view',\n};\n",
          )
          replace_once(
              'frontend/test/features/app_generation/data/datasources/mock_generator_renderer_contract_test.dart',
              "      ForgeSimulationProgressWidgetNode() => 'simulation_progress',\n      ForgeUnknownWidgetNode() => 'unknown',\n",
              "      ForgeSimulationProgressWidgetNode() => 'simulation_progress',\n      ForgeMapViewWidgetNode() => 'map_view',\n      ForgeUnknownWidgetNode() => 'unknown',\n",
          )

          # 4) map_view is no longer unknown in v1.16. Keep the unknown-widget
          # regression meaningful by using a type that truly does not exist.
          p = Path('backend/tests/test_schema_validator_extended.py')
          text = p.read_text(encoding='utf-8')
          old = '"children": [{"type": "map_view", "id": "m1"}],'
          if old in text:
              text = text.replace(old, '"children": [{"type": "future_map_widget", "id": "m1"}],', 1)
              p.write_text(text, encoding='utf-8')

          # 5) Lock the generic coordinate prerequisite at the semantic layer.
          test_path = Path('forge_ai/tests/test_map_capability_prerequisites.py')
          if not test_path.exists():
              test_path.write_text('''from forge_ai.core.semantics.capability_plan import plan_capabilities\n\n\ndef test_map_request_adds_explicit_numeric_coordinate_prerequisites():\n    plan = plan_capabilities("観測地点を地図で見ながらメモを記録したい")\n    fields = {field.name: field for field in plan.fields}\n    assert fields["latitude"].kind == "number"\n    assert fields["longitude"].kind == "number"\n    assert fields["latitude"].capability == "data.number"\n    assert fields["longitude"].capability == "data.number"\n\n\ndef test_map_prerequisites_do_not_invent_geocoding():\n    plan = plan_capabilities("札幌駅という場所を地図で見たい")\n    fields = {field.name: field for field in plan.fields}\n    assert "latitude" in fields and "longitude" in fields\n    # Coordinate fields are explicit inputs; no geocoded coordinate value is\n    # fabricated by semantic planning.\n    assert all(not hasattr(field, "value") for field in fields.values())\n''', encoding='utf-8')

          # 6) User-facing disclosure should test a capability that still really is
          # missing.  view.map is now an auto-acquirable BUILD_TIME capability.
          p = Path('backend/tests/test_forge_020a2_capability_disclosure.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def test_a_missing_map_view_is_disclosed(self) -> None:\n        """Catalog が知っている MISSING view を「問題なし」に戻さない。"""\n        gap = _generate(self.client, MAP).get("capability_gap")\n        self.assertIsNotNone(gap)\n        self.assertIn("view.map", gap["missing"])\n'''
          new = '''    def test_a_still_missing_view_is_disclosed(self) -> None:\n        """Self-Extension済みの能力ではなく、現在も未獲得の能力を検査する。"""\n        result = _generate(self.client, "予定をカレンダーで見たい")\n        gap = result.get("capability_gap")\n        self.assertIsNotNone(gap)\n        self.assertIn("view.calendar", gap["missing"])\n'''
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          # Commit the production/test fix as one atomic patch.
          import subprocess
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add',
                          'forge_ai/core/semantics/capability_plan.py',
                          'forge_ai/tests/test_map_capability_prerequisites.py',
                          'frontend/lib/json_ui/widget_registry/widget_registry_core.dart',
                          'frontend/test/features/app_generation/data/datasources/mock_generator_renderer_contract_test.dart',
                          'backend/tests/test_schema_validator_extended.py',
                          'backend/tests/test_forge_020a2_capability_disclosure.py'], check=True)
          subprocess.run(['git', 'commit', '-m', 'fix: close map capability prerequisite and runtime contracts'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:claude/forge-master-handoff-k46jns'], check=True)
