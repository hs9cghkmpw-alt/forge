name: Self Extension view detection patch

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - name: Patch semantic view capability detection
        shell: python
        run: |
          from pathlib import Path

          p = Path('forge_ai/core/semantics/capabilities.py')
          text = p.read_text(encoding='utf-8')
          if '"detect_capabilities",' not in text:
              text = text.replace(
                  '    "capability_ids",\n    "is_known_capability",\n',
                  '    "capability_ids",\n    "detect_capabilities",\n    "is_known_capability",\n',
                  1,
              )
          if 'def detect_capabilities(' not in text:
              text += '''\n\ndef detect_capabilities(\n    text: str, *, layers: tuple[CapabilityLayer, ...] | None = None\n) -> tuple[str, ...]:\n    """Detect canonical capabilities directly from catalog-owned keywords.\n\n    This is a semantic vocabulary adapter, not a product template.  It is used\n    where a requested capability (for example a missing view primitive) has no\n    separate role-lexicon representation.  The catalog remains the single source\n    of truth for IDs and detection words.\n    """\n    allowed = set(layers) if layers is not None else None\n    found: list[str] = []\n    for definition in _CATALOG:\n        if allowed is not None and definition.layer not in allowed:\n            continue\n        if any(keyword in text for keyword in definition.detection_keywords):\n            found.append(definition.id)\n    return tuple(found)\n'''
          p.write_text(text, encoding='utf-8')

          p = Path('forge_ai/core/semantics/capability_plan.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from forge_ai.core.semantics.capabilities import (\n    SEMANTIC_CAPABILITIES,\n    SupportLevel,\n)',
              'from forge_ai.core.semantics.capabilities import (\n    SEMANTIC_CAPABILITIES,\n    CapabilityLayer,\n    SupportLevel,\n    detect_capabilities,\n)',
              1,
          )
          old = '''    roles = extract_semantic_roles(text)\n    if roles.is_empty:\n        return CapabilityPlan(roles=roles, structure=StructuralMode.UNKNOWN)\n\n    requested: set[str] = set()\n'''
          new = '''    roles = extract_semantic_roles(text)\n    # Some canonical capabilities intentionally do not have a second role-lexicon\n    # entry.  Missing presentation primitives such as map/calendar/line-chart must\n    # still survive planning as exact gaps instead of disappearing when their only\n    # evidence is the canonical capability keyword.  Restrict this direct adapter\n    # to VIEW here; behavior/effect words need role context to avoid semantic\n    # ambiguity (for example generic "組み合わせ" vs audio mixing).\n    directly_requested = set(detect_capabilities(text, layers=(CapabilityLayer.VIEW,)))\n    if roles.is_empty:\n        ok, partial, missing = _classify(directly_requested)\n        return CapabilityPlan(\n            roles=roles,\n            structure=StructuralMode.UNKNOWN,\n            views=tuple(c for c in ok if c.startswith("view.")),\n            requested=tuple(sorted(directly_requested)),\n            partial=partial,\n            missing=missing,\n        )\n\n    requested: set[str] = set(directly_requested)\n'''
          if old not in text:
              raise SystemExit('capability_plan insertion point not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit semantic detection patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge_ai/core/semantics/capabilities.py forge_ai/core/semantics/capability_plan.py
          git commit -m "feat: preserve catalog view gaps without duplicate role patterns"
          git push origin HEAD:claude/forge-master-handoff-k46jns
