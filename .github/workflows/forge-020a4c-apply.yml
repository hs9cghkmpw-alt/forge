name: FORGE-020A4C one-shot apply

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a4c-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify expected base is ancestor
        shell: bash
        run: git merge-base --is-ancestor e659181427224242458561a06a32af01b8295023 HEAD
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Repair staging-script quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_forge_020a4c.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          lines[487:489] = ['    "                \\"厳格な schema mode で受理された応答ではない\\"\\n"']
          lines[481:483] = ['    "                \\"Forge の Entity sanitizer による補正が必要だった\\"\\n"']
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Compile applier
        run: python -m py_compile scripts/_apply_forge_020a4c.py
      - name: Apply reviewed source transformations
        run: python scripts/_apply_forge_020a4c.py
      - name: Syntax smoke
        run: |
          python -m compileall -q forge_ai backend/app scripts/verify_local_model_level0.py
          git diff --check
      - name: Focused integrity tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python -m pytest -q forge_ai/tests/test_forge_020a4c_entity_contract_evidence.py
          python -m pytest -q backend/tests/test_forge_020a4c_real_structure_integrity.py
      - name: Commit and push implementation
        shell: bash
        run: |
          git config user.name "forge-020a4c-bot"
          git config user.email "forge-020a4c-bot@users.noreply.github.com"
          git add forge_ai backend scripts/verify_local_model_level0.py docs CHANGELOG.md TECH_DEBT.md
          git status --short
          git commit -m "forge-020a4c: separate model contract from Forge repairs"
          git push origin HEAD:claude/forge-master-handoff-k46jns
