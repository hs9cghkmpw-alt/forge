name: FORGE-020A4C skeptical closeout

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a4c-apply.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Verify reviewed implementation is ancestor
        run: git merge-base --is-ancestor 4bb9702d2df495bdda06892704b174ed061388ef HEAD
      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile closeout transformer
        run: python -m py_compile scripts/_finalize_forge_020a4c.py
      - name: Apply skeptical-review fixes
        run: python scripts/_finalize_forge_020a4c.py
      - name: Syntax and diff checks
        run: |
          python -m compileall -q forge_ai backend/app scripts/verify_local_model_level0.py
          git diff --check
      - name: Focused 020A4C and production-path tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python -m pytest -q forge_ai/tests/test_forge_020a4c_entity_contract_evidence.py
          python -m pytest -q backend/tests/test_forge_020a4c_real_structure_integrity.py
          python -m pytest -q backend/tests/test_forge_020a_local_model_path.py
          python -m pytest -q backend/tests/test_forge_020a4_level0_preflight.py
      - name: Full forge_ai suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q forge_ai/tests
      - name: Full backend suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests
      - name: Remove one-shot implementation machinery
        run: |
          git rm .github/workflows/forge-020a4c-apply.yml
          git rm scripts/_apply_forge_020a4c.py
          git rm scripts/_finalize_forge_020a4c.py
      - name: Commit and push closeout
        shell: bash
        run: |
          git config user.name "forge-020a4c-bot"
          git config user.email "forge-020a4c-bot@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "forge-020a4c: close strict-contract integrity gaps"
          git push origin HEAD:claude/forge-master-handoff-k46jns
