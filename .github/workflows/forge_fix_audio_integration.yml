name: FORGE audio integration fixes

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_fix_audio_integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - name: Apply integration fixes
        run: python scripts/forge_fix_audio_integration.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q 'test_a_game_keeps_partial_audio_truth_explicit' forge_ai/tests/test_semantic_roles_and_capability_plan.py
          grep -q 'if (mounted) {' frontend/lib/json_ui/widget_registry/widget_registry_v1_14.dart
      - name: Remove one-shot files
        run: |
          rm scripts/forge_fix_audio_integration.py
          rm .github/workflows/forge_fix_audio_integration.yml
      - name: Commit and push
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: align audio mix tests and Flutter lint"
          git push origin HEAD:claude/forge-master-handoff-k46jns
