name: FORGE simulation plan axis migration

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_simulation_plan_patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded plan-axis patch
        run: python scripts/forge_add_simulation_plan_axis.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q 'simulations: tuple\[str, ...\]' forge_ai/core/semantics/capability_plan.py
          grep -q 'set(plan.simulations)' backend/tests/test_forge_020a2_capability_sot.py
      - name: Remove one-shot migration machinery
        run: rm scripts/forge_add_simulation_plan_axis.py .github/workflows/forge_simulation_plan_patch.yml
      - name: Commit plan axis
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "forge-golden: preserve simulation as a first-class plan axis"
          git push origin HEAD:claude/forge-master-handoff-k46jns
