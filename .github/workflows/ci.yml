# Forge CI（FORGE-AI-FOUNDATION-011 §7、2026-08-17）
#
# ---
#
# ## 何を守るためのCIか
#
# Forgeのテストは「基盤が動くこと」より **「基盤が本番から使われて
# いること」** を測る方向へ寄せてきた（Phase Bの Anti-Bypass
# Regression、R0の Experience Wiring）。この種のテストは、
# 「気を付ける」では守れないものを機械に守らせるためにある。
#
# CIも同じ役割である。ローカルで通ったかどうかは記憶に頼る話であり、
# 記憶は忘れる。
#
# ## 実APIを絶対に呼ばない
#
# `FORGE_LIVE_TEST` を設定しない。設定しない限り
# `tests/test_live_api.py` は自分でSKIPする（既定SKIP、010 Phase I）。
# CIへAPIキーを置かないので、
#
#   * 無料枠を消費しない（§38）
#   * Secretを持たないので漏れない（§14〜18の境界をCIでも保つ）
#   * PRからの実行でSecretが露出する経路が最初から存在しない
#
# Providerが未設定な環境では Auto Discovery が候補を空にするため、
# 実Providerを要求するテストは存在しない構成になっている。

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# 同じブランチへ続けてpushしたとき、古い実行を止める。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend + forge_ai (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt が明示している上限・下限の両端で回す。
        # pydantic 2.7.4 / supabase 2.5.1 は 3.13 のwheelを出して
        # いないので 3.13 は入れない（上限を上げるのは、その2つを
        # 上げてからの話である。requirements.txt 冒頭のコメント参照）。
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: forge_ai tests
        working-directory: forge_ai
        run: python -m pytest tests -q

      - name: backend tests
        working-directory: backend
        # 実APIは呼ばない（FORGE_LIVE_TEST を設定しない = test_live_api.py は自分でSKIPする）。
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------
  # Backend smoke（013 §7）
  #
  # 「テストが通る」と「サーバーが起動して応答する」は別である。
  # 実際に uvicorn を立てて HTTP を叩く。とくに **CORS** を見る:
  # regex を書き間違えても unit test は通りうるが、開発中の Flutter Web
  # からは繋がらなくなる。CI をすり抜ける形にしない。
  #
  # 実 Cloud API は呼ばない。API Key も置かない。Mock を本番の
  # fallback にもしない（Provider を指定しないので、AI を呼ぶ経路自体を
  # 叩かない ── /health と OPTIONS だけで足りる）。
  # ---------------------------------------------------------------------
  backend-smoke:
    name: backend smoke (起動 + CORS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Start uvicorn
        env:
          FORGE_ENV: development
          # 空文字の optional env でも起動できること（013 §2 の実バグ）。
          # `.env.example` をコピーした利用者と同じ状態を CI で再現する。
          FORGE_LOCAL_TIMEOUT_SECONDS: ""
          FORGE_GROQ_TIMEOUT_SECONDS: ""
        run: |
          # 出力をファイルへ逃がす。stdout を継承したまま background に
          # すると、runner が step の終了を待ち続けることがある。
          nohup python -m uvicorn backend.app.main:app \
            --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "起動を確認"; exit 0
            fi
            sleep 1
          done
          echo "30秒待っても /health が応答しない"
          cat /tmp/uvicorn.log
          exit 1

      - name: GET /health は 200
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health)
          test "$code" = "200" || { echo "health=$code"; exit 1; }

      - name: localhost Origin の preflight が通る
        run: |
          headers=$(curl -s -i -X OPTIONS http://127.0.0.1:8000/api/v1/ai/converse \
            -H 'Origin: http://localhost:56000' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')
          echo "$headers" | head -20
          echo "$headers" | grep -qi '^HTTP/1.1 200' \
            || { echo 'preflight が 200 を返さない'; exit 1; }
          echo "$headers" | grep -qi '^access-control-allow-origin: http://localhost:56000' \
            || { echo 'Access-Control-Allow-Origin が Origin と一致しない'; exit 1; }

      - name: 外部 Origin は許可されない
        run: |
          headers=$(curl -s -i -X OPTIONS http://127.0.0.1:8000/api/v1/ai/converse \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')
          if echo "$headers" | grep -qi '^access-control-allow-origin'; then
            echo '外部 Origin を許可している'; exit 1
          fi

      - name: Stop uvicorn
        if: always()
        run: kill "$(cat /tmp/uvicorn.pid)" || true

  frontend:
    name: frontend (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pubspec.yaml の sdk: '>=3.3.0 <4.0.0' に対して stable を使う。
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: frontend
        run: flutter pub get

      # `flutter analyze` は 2026-08-13 に warning/info 含めて0件へ
      # 落としてある（STATUS.md）。0件を保つのが目的なので、
      # info も失敗として扱う。
      - name: flutter analyze
        working-directory: frontend
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: flutter test
        working-directory: frontend
        run: flutter test

      # ---------------------------------------------------------------
      # 生成した Dart を実 `dart` でビルドする経路（020F / TD94）。
      #
      # Python job には dart も flutter も無いので、この経路は
      # あちらでは **skip される**。skip されたテストは何も証明しない
      # ので、`dart` を持っているこの job で走らせる。
      # `FORGE_REQUIRE_DART_BUILD=1` は「dart が無ければ skip ではなく
      # 失敗させる」指定である——静かに素通りする形にしない。
      #
      # 実 API は呼ばない（Provider は Test Double）。
      # ---------------------------------------------------------------
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 生成 Dart の実ビルド経路
        working-directory: forge_ai
        env:
          FORGE_REQUIRE_DART_BUILD: "1"
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest tests/test_dart_build_plan.py -q

      # ---------------------------------------------------------------
      # 獲得した Capability が Forge のアプリへ載って描けること（TD94）。
      #
      # 隔離 workspace で dart が通っただけでは「Forge が描ける」ことに
      # ならない。ここで実際に install し、**その状態で** analyze /
      # test / build web を通す。
      #
      # `test_acquired/` を `test/` の外に置いてあるのは、素の checkout で
      # `flutter test` が落ちないようにするためである。「生成物が無ければ
      # skip」にすると **skip が PASS として数えられる**ので、そうしない。
      # 生成物が無ければ skip ではなく失敗する。
      #
      # 実 API は呼ばない（Provider は Test Double）。
      # ---------------------------------------------------------------
      # 会話の入口が、簡単な要求で LLM を呼ばないこと（実機の速度 FAIL）。
      # ランダム自由文で測る。落ちたらログの seed を `--seed` へ渡す。
      - name: 会話入口の速い道（簡単な要求で LLM 0 回）
        run: python3 scripts/converse_fast_path_e2e.py

      # 自由文はランダムに作る。**固定文へ Forge を最適化させない。**
      # 落ちたらログに出た seed を `--seed` へ渡せば完全に同じ試験を再実行できる。
      - name: 自由文 E2E（既存能力なら生成0回 / 足りない分だけ1回 / 2回目は再利用）
        run: python3 scripts/reuse_first_e2e.py

      - name: 獲得 Capability を Forge アプリへ載せる
        run: python3 scripts/acquired_capability_flutter_e2e.py

      - name: flutter analyze（獲得 Capability を載せた状態）
        working-directory: frontend
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: flutter test（獲得 Capability が実際に描かれる）
        working-directory: frontend
        run: flutter test test_acquired

      # 013 §7: analyze と test が通っても **Web build は落ちうる**
      # （Web 非対応の依存、条件付き import、dart2js だけが出す型エラー等）。
      # Forge の完成図は Web IDE なので、Web が build できることは
      # 品質ではなく前提である。
      # 獲得 Capability を載せたまま build する。載せた Dart が Web まで
      # 通ることは、品質ではなく前提である。
      - name: flutter build web
        working-directory: frontend
        run: flutter build web --debug
