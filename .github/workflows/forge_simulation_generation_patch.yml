name: FORGE simulation production generation migration

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_simulation_generation_patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply production simulation generation patch
        run: python scripts/forge_enable_simulation_generation.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q 'simulation_capabilities=capability_plan.simulations' forge_ai/core/orchestration/pipeline_orchestrator.py
          grep -q '"simulate.loop": ("simulation_loop",)' backend/app/ai/runtime/capability.py
          grep -A2 '"simulate.loop"' forge_ai/core/semantics/capabilities.py | grep -q '_S.IMPLEMENTED'
          grep -q 'def _attach_simulation_loop' forge_ai/core/ir/forge_language_compiler.py
      - name: Remove temporary migration and probe machinery
        run: |
          rm scripts/forge_enable_simulation_generation.py
          rm .github/workflows/forge_simulation_generation_patch.yml
          rm .github/workflows/forge_simulation_pipeline_probe.yml
      - name: Commit production simulation generation
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "forge-golden: generate deterministic simulation loop"
          git push origin HEAD:claude/forge-master-handoff-k46jns
