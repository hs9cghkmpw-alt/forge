name: Whole Scan GA-1 logic validator

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - name: Add fail-closed GA-1 logic validation
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'backend/app/ai/validators/schema_validator.py'
          replace_once(
              path,
              'MAX_FIELD_BINDINGS = 20  # add_record.field_bindingsの上限(MAX_RECORD_FIELDSと揃える)\n',
              'MAX_FIELD_BINDINGS = 20  # add_record.field_bindingsの上限(MAX_RECORD_FIELDSと揃える)\n'
              'MAX_GA1_LOGIC_ENTRIES = 100\n'
              'MAX_GA1_EXPRESSION_DEPTH = 24\n'
              'GA1_UNARY_OPS = {"not", "negate"}\n'
              'GA1_BINARY_OPS = {"add", "subtract", "multiply", "divide", "eq", "neq", "lt", "lte", "gt", "gte", "and", "or"}\n'
              'GA1_AGGREGATE_OPS = {"sum", "count", "average", "min", "max"}\n',
          )

          marker = '''def _check_schema(doc: Any, path: str) -> list[ValidationIssue]:\n'''
          helper = r'''def _check_ga1_expression(expr: Any, path: str, *, depth: int = 0, allow_field: bool = False) -> list[ValidationIssue]:
    errors: list[ValidationIssue] = []
    if depth > MAX_GA1_EXPRESSION_DEPTH:
        return [_err(path, Category.RUNTIME_SAFETY, "logic_expression_depth", "logic expressionのネストが深すぎます。")]
    if not isinstance(expr, dict):
        return [_err(path, Category.SCHEMA, "logic_expression_object", "logic expressionはobjectである必要があります。")]
    kind = expr.get("kind")
    if kind == "literal":
        errors.extend(_check_additional_properties(expr, {"kind", "value"}, path))
        value = expr.get("value")
        if isinstance(value, (dict, list)):
            errors.append(_err(f"{path}/value", Category.SCHEMA, "logic_literal_scalar", "literal.valueはscalar/nullのみ使用できます。"))
        return errors
    if kind == "state":
        errors.extend(_check_additional_properties(expr, {"kind", "key"}, path))
        if not _is_nonempty_str(expr.get("key"), 64):
            errors.append(_err(f"{path}/key", Category.SCHEMA, "logic_state_key", "state.keyは1〜64文字の文字列である必要があります。"))
        return errors
    if kind == "field" and allow_field:
        errors.extend(_check_additional_properties(expr, {"kind", "field"}, path))
        if not _is_nonempty_str(expr.get("field"), 64):
            errors.append(_err(f"{path}/field", Category.SCHEMA, "logic_field_name", "field.fieldは1〜64文字の文字列である必要があります。"))
        return errors
    if kind == "unary":
        errors.extend(_check_additional_properties(expr, {"kind", "op", "value"}, path))
        if expr.get("op") not in GA1_UNARY_OPS:
            errors.append(_err(f"{path}/op", Category.SCHEMA, "logic_unary_op", f"未対応のunary opです: {expr.get('op')!r}"))
        if "value" not in expr:
            errors.append(_err(f"{path}/value", Category.SCHEMA, "required", "unary.valueは必須です。"))
        else:
            errors.extend(_check_ga1_expression(expr["value"], f"{path}/value", depth=depth + 1, allow_field=allow_field))
        return errors
    if kind == "binary":
        errors.extend(_check_additional_properties(expr, {"kind", "op", "left", "right"}, path))
        if expr.get("op") not in GA1_BINARY_OPS:
            errors.append(_err(f"{path}/op", Category.SCHEMA, "logic_binary_op", f"未対応のbinary opです: {expr.get('op')!r}"))
        for side in ("left", "right"):
            if side not in expr:
                errors.append(_err(f"{path}/{side}", Category.SCHEMA, "required", f"binary.{side}は必須です。"))
            else:
                errors.extend(_check_ga1_expression(expr[side], f"{path}/{side}", depth=depth + 1, allow_field=allow_field))
        return errors
    if kind == "aggregate":
        errors.extend(_check_additional_properties(expr, {"kind", "source", "op", "field", "where"}, path))
        if not _is_nonempty_str(expr.get("source"), 64):
            errors.append(_err(f"{path}/source", Category.SCHEMA, "logic_aggregate_source", "aggregate.sourceは1〜64文字の文字列である必要があります。"))
        op = expr.get("op")
        if op not in GA1_AGGREGATE_OPS:
            errors.append(_err(f"{path}/op", Category.SCHEMA, "logic_aggregate_op", f"未対応のaggregate opです: {op!r}"))
        if op != "count" and not _is_nonempty_str(expr.get("field"), 64):
            errors.append(_err(f"{path}/field", Category.SCHEMA, "logic_aggregate_field", f"aggregate.{op}にはfieldが必要です。"))
        if "where" in expr:
            errors.extend(_check_ga1_expression(expr["where"], f"{path}/where", depth=depth + 1, allow_field=True))
        return errors
    errors.append(_err(f"{path}/kind", Category.SCHEMA, "logic_expression_kind", f"未対応のexpression kindです: {kind!r}"))
    return errors


def _check_ga1_logic(logic: Any, path: str) -> list[ValidationIssue]:
    if not isinstance(logic, dict):
        return [_err(path, Category.SCHEMA, "logic_object", "logicはobjectである必要があります。")]
    errors = _check_additional_properties(logic, {"derived", "visible_when"}, path)
    for section in ("derived", "visible_when"):
        if section not in logic:
            continue
        value = logic[section]
        if not isinstance(value, dict):
            errors.append(_err(f"{path}/{section}", Category.SCHEMA, "logic_section_object", f"logic.{section}はobjectである必要があります。"))
            continue
        if len(value) > MAX_GA1_LOGIC_ENTRIES:
            errors.append(_err(f"{path}/{section}", Category.RUNTIME_SAFETY, "logic_entry_limit", f"logic.{section}は最大{MAX_GA1_LOGIC_ENTRIES}件です。"))
        for name, expression in value.items():
            if not _is_nonempty_str(name, 64):
                errors.append(_err(f"{path}/{section}", Category.SCHEMA, "logic_entry_name", "logic entry名は1〜64文字の文字列である必要があります。"))
                continue
            errors.extend(_check_ga1_expression(expression, f"{path}/{section}/{name}"))
    return errors


'''
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('schema marker missing')
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text, encoding='utf-8')

          replace_once(
              path,
              '    allowed_keys = {"version", "app", "initial_screen_id", "screens", "record_schemas", "design_tokens"}\n',
              '    allowed_keys = {"version", "app", "initial_screen_id", "screens", "record_schemas", "design_tokens", "logic"}\n',
          )
          replace_once(
              path,
              '    if "app" in doc:\n',
              '    if "logic" in doc:\n'
              '        if not _version_at_least(version, "1.15"):\n'
              '            errors.append(_err(f"{path}/logic", Category.SCHEMA, "field_not_allowed_in_version",\n'
              '                               "logicはv1.15以降の文書でのみ使用できます。"))\n'
              '        else:\n'
              '            errors.extend(_check_ga1_logic(doc["logic"], f"{path}/logic"))\n\n'
              '    if "app" in doc:\n',
          )

          Path('backend/tests/test_ga1_logic_validator.py').write_text('''from app.ai.validators.schema_validator import validate_forge_document\n\n\ndef _doc(version: str = "1.15") -> dict:\n    return {\n        "version": version,\n        "initial_screen_id": "s",\n        "screens": [{\n            "id": "s", "title": "T", "state": {},\n            "body": {"type": "column", "id": "root", "children": []},\n        }],\n    }\n\n\ndef test_ga1_logic_is_validated_as_first_class_document_field() -> None:\n    doc = _doc()\n    doc["logic"] = {\n        "derived": {\n            "balance": {\n                "kind": "binary", "op": "subtract",\n                "left": {"kind": "state", "key": "income"},\n                "right": {"kind": "state", "key": "expense"},\n            }\n        },\n        "visible_when": {\n            "warning": {\n                "kind": "binary", "op": "lt",\n                "left": {"kind": "state", "key": "balance"},\n                "right": {"kind": "literal", "value": 0},\n            }\n        },\n    }\n    assert validate_forge_document(doc).valid\n\n\ndef test_unknown_logic_operator_fails_closed() -> None:\n    doc = _doc()\n    doc["logic"] = {"derived": {"x": {"kind": "binary", "op": "execute_python", "left": {"kind": "literal", "value": 1}, "right": {"kind": "literal", "value": 2}}}}\n    result = validate_forge_document(doc)\n    assert not result.valid\n    assert any(error.rule == "logic_binary_op" for error in result.errors)\n\n\ndef test_logic_is_not_silently_allowed_in_older_language_versions() -> None:\n    doc = _doc("1.14")\n    doc["logic"] = {"derived": {"x": {"kind": "literal", "value": 1}}}\n    result = validate_forge_document(doc)\n    assert not result.valid\n    assert any(error.rule == "field_not_allowed_in_version" for error in result.errors)\n\n\ndef test_aggregate_where_allows_field_refs_but_top_level_does_not() -> None:\n    doc = _doc()\n    doc["logic"] = {\n        "derived": {\n            "food_total": {\n                "kind": "aggregate", "source": "records", "op": "sum", "field": "amount",\n                "where": {\n                    "kind": "binary", "op": "eq",\n                    "left": {"kind": "field", "field": "category"},\n                    "right": {"kind": "literal", "value": "food"},\n                },\n            }\n        }\n    }\n    assert validate_forge_document(doc).valid\n\n    doc["logic"] = {"derived": {"bad": {"kind": "field", "field": "amount"}}}\n    result = validate_forge_document(doc)\n    assert not result.valid\n    assert any(error.rule == "logic_expression_kind" for error in result.errors)\n''', encoding='utf-8')

      - name: Commit GA-1 validator
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/ai/validators/schema_validator.py backend/tests/test_ga1_logic_validator.py
          git commit -m "feat: validate GA-1 document logic fail closed"
          git push origin HEAD:claude/forge-master-handoff-k46jns
