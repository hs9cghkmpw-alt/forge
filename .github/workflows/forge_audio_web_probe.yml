name: FORGE real Chrome audio mixer probe

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_audio_web_probe.yml
      - frontend/pubspec.yaml
      - frontend/pubspec.lock
      - frontend/lib/audio_probe_main.dart
      - frontend/lib/json_ui/widget_registry/widget_registry_v1_14.dart
      - frontend/assets/sounds/**
      - scripts/serve_audio_web_probe.py

concurrency:
  group: forge-real-chrome-audio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chrome-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies from a clean web build state
        working-directory: frontend
        run: |
          flutter config --enable-web
          flutter clean
          flutter pub get
      - name: Build real Flutter Web audio probe
        working-directory: frontend
        run: flutter build web --debug --target lib/audio_probe_main.dart
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Serve probe and capture same-origin result
        run: |
          rm -f /tmp/forge_audio_result.json /tmp/forge_audio_server.log
          python scripts/serve_audio_web_probe.py \
            --root frontend/build/web \
            --report /tmp/forge_audio_result.json \
            --port 8080 > /tmp/forge_audio_server.log 2>&1 &
          echo $! > /tmp/forge_audio_server.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/ >/dev/null && break
            sleep 1
          done

          # No webdriver/debug-service dependency: launch the exact compiled app,
          # allow autoplay in this deterministic evidence environment, and wait
          # for the app itself to report whether both real web AudioPlayers started.
          timeout 25s /usr/bin/google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --autoplay-policy=no-user-gesture-required \
            --disable-background-timer-throttling \
            http://127.0.0.1:8080/ >/tmp/forge_audio_chrome.log 2>&1 || true

          for i in $(seq 1 20); do
            test -f /tmp/forge_audio_result.json && break
            sleep 1
          done
          echo '--- server ---'
          cat /tmp/forge_audio_server.log || true
          echo '--- chrome tail ---'
          tail -80 /tmp/forge_audio_chrome.log || true
          echo '--- result ---'
          test -f /tmp/forge_audio_result.json || { echo 'browser did not report'; exit 1; }
          cat /tmp/forge_audio_result.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/forge_audio_result.json').read_text())
          assert data.get('status') == 'pass', data
          print('FORGE_AUDIO_E2E compiled_web_two_layers=PASS')
          PY
      - name: Stop evidence server
        if: always()
        run: |
          test -f /tmp/forge_audio_server.pid && kill "$(cat /tmp/forge_audio_server.pid)" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-real-chrome-audio-evidence
          path: |
            /tmp/forge_audio_result.json
            /tmp/forge_audio_server.log
            /tmp/forge_audio_chrome.log
          if-no-files-found: warn

# The browser executes a compiled Flutter Web application, therefore Flutter's
# generated web plugin registrant initializes audioplayers_web. The probe reports
# its result over same-origin HTTP, avoiding the webdriver/debug-service harness
# that previously hung before the integration test could start.
