name: FORGE real Chrome audio mixer probe

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_audio_web_probe.yml

permissions:
  contents: read

jobs:
  chrome-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: frontend
        run: flutter pub get
      - name: Verify Chrome is available
        run: google-chrome --version || chromium --version
      - name: Create deterministic Chrome launcher for media probe
        run: |
          cat >/tmp/forge-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --autoplay-policy=no-user-gesture-required "$@"
          EOF
          chmod +x /tmp/forge-chrome
      - name: Run real browser audio mixer probe
        working-directory: frontend
        env:
          CHROME_EXECUTABLE: /tmp/forge-chrome
        run: flutter test --platform chrome test/json_ui/forge_audio_mixer_web_test.dart --reporter expanded

# One-shot evidence trigger with CI autoplay policy disabled so the probe measures Forge/audioplayers rather than headless-browser media policy. Remove after green evidence.
