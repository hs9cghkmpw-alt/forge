name: FORGE real Chrome audio mixer probe

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_audio_web_probe.yml
      - frontend/pubspec.yaml
      - frontend/pubspec.lock
      - frontend/integration_test/forge_audio_mixer_web_integration_test.dart
      - frontend/test_driver/integration_test.dart
      - frontend/lib/json_ui/widget_registry/widget_registry_v1_14.dart
      - frontend/assets/sounds/**

permissions:
  contents: read

jobs:
  chrome-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies from a clean web build state
        working-directory: frontend
        run: |
          flutter clean
          flutter pub get
      - name: Verify Chrome is available
        run: google-chrome --version || chromium --version
      - name: Create deterministic Chrome launcher for media probe
        run: |
          cat >/tmp/forge-chrome <<'EOF'
          #!/bin/sh
          exec /usr/bin/google-chrome --autoplay-policy=no-user-gesture-required "$@"
          EOF
          chmod +x /tmp/forge-chrome
      - name: Run compiled Flutter Web integration probe
        working-directory: frontend
        env:
          CHROME_EXECUTABLE: /tmp/forge-chrome
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/forge_audio_mixer_web_integration_test.dart \
            -d chrome

# This probe compiles and launches a Flutter Web application, so the generated
# web plugin registrant runs. It is intentionally stronger than
# `flutter test --platform chrome`, whose test harness can bypass app plugin
# registration and produce false MissingPluginException failures.
