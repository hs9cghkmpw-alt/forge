name: FORGE-020B apply production wiring

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply FORGE-020B wiring
        run: python scripts/apply_020b.py

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Focused 020B verification
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_forge_020b_local_agent_production.py
          tests/test_forge_020_production_wiring.py
          tests/test_confirmation_store.py
          tests/test_forge_020_agent_security.py

      - name: Syntax and diff checks
        run: |
          python -m compileall -q backend/app backend/tests/test_forge_020b_local_agent_production.py
          git diff --check

      - name: Remove one-off apply machinery
        run: |
          git rm -f scripts/apply_020b.py
          git rm -f .github/workflows/forge-020b-apply.yml

      - name: Commit and push FORGE-020B
        run: |
          git config user.name 'forge-020b-apply-bot'
          git config user.email 'forge-020b-apply-bot@users.noreply.github.com'
          git add backend/app backend/tests
          git add -u .github/workflows scripts
          git diff --cached --check
          git status --short
          git commit -m 'forge-020b: wire Local Tool Agent into production generation'
          git push origin HEAD:claude/forge-master-handoff-k46jns
