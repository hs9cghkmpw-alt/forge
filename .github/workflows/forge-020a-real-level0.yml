# FORGE-020A5 post-schema-contract real rerun
name: FORGE-020A real Local Level 0

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a-real-level0.yml
      - backend/app/ai/runtime/forge_ai_provider_bridge.py
      - backend/tests/test_forge_020a5_entity_schema_contract.py
      - forge_ai/prompt/prompt_builder.py

permissions:
  contents: read

jobs:
  real-level0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
      FORGE_LOCAL_BASE_URL: http://127.0.0.1:11434/v1
      FORGE_LOCAL_MODEL: qwen2.5:7b-instruct
      FORGE_LOCAL_TIMEOUT_SECONDS: '300'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_KEEP_ALIVE: '10m'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Forge backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Install Ollama on ephemeral runner
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Start real Ollama runtime
        shell: bash
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          echo $! >/tmp/ollama.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null; then
              echo 'Ollama runtime reachable'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull selected real open-weight model
        shell: bash
        run: |
          ollama pull qwen2.5:7b-instruct
          ollama list
          curl -sf http://127.0.0.1:11434/api/tags > /tmp/ollama-tags.json

      - name: Forge environment diagnosis
        run: python scripts/forge_doctor.py

      - name: Cheap Level 0 production preflight
        run: python scripts/preflight_local_model_level0.py

      - name: Run genuine qwen2.5 7B Level 0 through Forge production path
        id: level0
        shell: bash
        run: |
          set +e
          python scripts/verify_local_model_level0.py 2>&1 | tee /tmp/forge-level0.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "$code" > /tmp/forge-level0-exit-code.txt
          exit 0

      - name: Show durable Level 0 evidence
        if: always()
        shell: bash
        run: |
          echo '--- verify output ---'
          cat /tmp/forge-level0.log || true
          echo '--- evidence files ---'
          find docs/evidence/level0 -maxdepth 1 -type f -name '*.json' -print 2>/dev/null || true
          for f in docs/evidence/level0/*.json; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-020a-real-level0-evidence
          if-no-files-found: warn
          path: |
            docs/evidence/level0/*.json
            /tmp/forge-level0.log
            /tmp/forge-level0-exit-code.txt
            /tmp/ollama-tags.json

      - name: Enforce verifier result
        if: always()
        shell: bash
        run: |
          code='${{ steps.level0.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo 'Level 0 verifier did not produce an exit code.'
            exit 1
          fi
          if [ "$code" != '0' ]; then
            echo "Real Local Level 0 verifier failed with exit code $code."
            exit "$code"
          fi
          echo 'Real Local Level 0 verifier returned success.'

      - name: Stop Ollama
        if: always()
        shell: bash
        run: kill "$(cat /tmp/ollama.pid)" 2>/dev/null || true
