name: FORGE visible simulation progression migration

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_simulation_progress_v15.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply visible simulation projection
        run: python scripts/forge_simulation_progress_v15.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q "simulation_progress" frontend/lib/json_ui/schema/forge_document.dart
          grep -q "registerV1_15Widgets" frontend/lib/json_ui/widget_registry/widget_registry.dart
          grep -q 'WIDGET_TYPES_V1_15_ADDITIONS = {"simulation_progress"}' backend/app/ai/validators/schema_validator.py
          grep -q 'type="simulation_progress"' forge_ai/core/ir/forge_language_compiler.py
      - name: Remove one-shot migration files
        run: |
          rm scripts/forge_simulation_progress_v15.py
          rm .github/workflows/forge_simulation_progress_v15.yml
      - name: Commit and push
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "forge-golden: make simulation progress visible"
          git push origin HEAD:claude/forge-master-handoff-k46jns
