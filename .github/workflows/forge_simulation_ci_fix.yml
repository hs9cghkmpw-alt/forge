name: FORGE simulation CI truth fix

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_simulation_ci_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - name: Apply fixes
        run: python scripts/forge_fix_simulation_ci.py
      - name: Verify shape
        run: |
          git diff --check
          grep -q 'names.extend(getattr(plan, "simulations"' backend/app/ai/runtime/prompt_pipeline.py
          grep -q "ForgeSimulationLoopWidgetNode() => 'simulation_loop'" frontend/test/features/app_generation/data/datasources/mock_generator_renderer_contract_test.dart
      - name: Remove one-shot files
        run: |
          rm scripts/forge_fix_simulation_ci.py
          rm .github/workflows/forge_simulation_ci_fix.yml
      - name: Commit and push
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: carry simulation truth through evidence and contracts"
          git push origin HEAD:claude/forge-master-handoff-k46jns
