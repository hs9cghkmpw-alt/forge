name: FORGE bounded local audio mix migration

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge_audio_mix_phase1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded local audio mix vertical slice
        run: python scripts/forge_audio_mix_phase1.py
      - name: Guard patch shape
        run: |
          git diff --check
          grep -q 'audioplayers: ^6.8.1' frontend/pubspec.yaml
          grep -q 'interact.audio_mix' forge_ai/core/semantics/capabilities.py
          grep -q '"interact.audio_mix": ("audio_mixer",)' backend/app/ai/runtime/capability.py
          grep -q 'def _attach_audio_mixer' forge_ai/core/ir/forge_language_compiler.py
          grep -q 'interaction_capabilities=capability_plan.interactions' forge_ai/core/orchestration/pipeline_orchestrator.py
          test -s frontend/assets/sounds/forge_tone_pulse.wav
          test -s frontend/assets/sounds/forge_tone_chime.wav
          test -s frontend/assets/sounds/forge_tone_bass.wav
      - name: Remove one-shot migration files
        run: |
          rm scripts/forge_audio_mix_phase1.py
          rm .github/workflows/forge_audio_mix_phase1.yml
      - name: Commit bounded local audio mix
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add -A
          git commit -m "forge-golden: add bounded local audio mixing"
          git push origin HEAD:claude/forge-master-handoff-k46jns
