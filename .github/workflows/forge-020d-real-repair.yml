name: FORGE-020D real generated Flutter repair

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns

permissions:
  contents: read

jobs:
  real-generated-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run real generated Flutter repair probe
        run: python scripts/verify_generated_flutter_repair_020d.py
