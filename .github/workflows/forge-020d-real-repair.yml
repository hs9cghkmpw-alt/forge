name: FORGE-020D real generated Flutter repair

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-generated-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run real generated Flutter repair probe
        env:
          FORGE_020D_EVIDENCE_PATH: /tmp/forge-020d-real-evidence.json
        run: python scripts/verify_generated_flutter_repair_020d.py

      - name: Upload objective repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-020d-real-generated-repair-evidence
          path: /tmp/forge-020d-real-evidence.json
          if-no-files-found: ignore
          retention-days: 90
