name: FORGE-020A5 entity schema contract apply

on:
  push:
    branches:
      - claude/forge-master-handoff-k46jns
    paths:
      - .github/workflows/forge-020a5-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/forge-master-handoff-k46jns
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Repair patcher test insertion for pytest-style file
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/_apply_forge_020a5_entity_schema.py')
          text = p.read_text(encoding='utf-8')
          marker = '# Extend existing 020A4C contract tests with the same-category hole discovered'
          if marker not in text:
              raise SystemExit('patcher marker missing')
          prefix = text.split(marker, 1)[0]
          tail = r'''# Extend existing 020A4C contract tests with the same-category hole discovered
          # by skeptical review: 7 choices is inside the product sanitizer ceiling but
          # outside the strict model contract.
          contract_test = ROOT / "forge_ai/tests/test_forge_020a4c_entity_contract_evidence.py"
          text = contract_test.read_text(encoding="utf-8")
          extra = r'''


def test_seven_choices_cannot_masquerade_as_strict_model_success():
    raw = _valid()
    raw["fields"][0].update({
        "type": "choice",
        "choices": ["a", "b", "c", "d", "e", "f", "g"],
    })
    ev = _entity_contract_evidence(raw, structured_output_mode="json_schema")
    assert ev.strict_contract_passed is False
'''
          if 'test_seven_choices_cannot_masquerade_as_strict_model_success' in text:
              raise SystemExit('choice-cardinality test already present unexpectedly')
          contract_test.write_text(text.rstrip() + extra + "\n", encoding="utf-8")

          print("FORGE-020A5 entity schema contract patch applied")
          '''
          # Remove indentation introduced by the YAML heredoc's Python source.
          tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in tail.splitlines()) + '\n'
          p.write_text(prefix + tail, encoding='utf-8')
          PY
      - name: Compile patcher
        run: python -m py_compile scripts/_apply_forge_020a5_entity_schema.py
      - name: Apply canonical schema contract patch
        run: python scripts/_apply_forge_020a5_entity_schema.py
      - name: Syntax and diff checks
        run: |
          python -m compileall -q forge_ai backend/app backend/tests
          git diff --check
      - name: Focused schema and Level0 integrity tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: |
          python -m pytest -q backend/tests/test_forge_020a5_entity_schema_contract.py
          python -m pytest -q forge_ai/tests/test_forge_020a4c_entity_contract_evidence.py
          python -m pytest -q backend/tests/test_forge_020a4c_real_structure_integrity.py
          python -m pytest -q backend/tests/test_forge_020a4_level0_preflight.py
          python -m pytest -q backend/tests/test_forge_020a_local_model_path.py
      - name: Full forge_ai suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q forge_ai/tests
      - name: Full backend suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests
      - name: Remove one-shot patch machinery
        run: |
          git rm .github/workflows/forge-020a5-apply.yml
          git rm scripts/_apply_forge_020a5_entity_schema.py
      - name: Commit and push product fix
        shell: bash
        run: |
          git config user.name "forge-020a5-bot"
          git config user.email "forge-020a5-bot@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "forge-020a5: enforce entity contract in provider schema"
          git push origin HEAD:claude/forge-master-handoff-k46jns
